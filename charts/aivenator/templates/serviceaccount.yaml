---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aivenator.serviceAccountName" . }}
  labels:
    {{- include "aivenator.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aivenator.fullname" . }}
  labels:
    {{- include "aivenator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - aiven.nais.io
    resources:
      - aivenapplications
      - aivenapplications/status
    verbs:
      - get
      - list
      - watch
      - update
      - delete
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - update
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - aiven.io
    resources:
      - opensearches
      - valkeys
    verbs:
      - get
      - list
  - apiGroups:
      - aiven.io
    resources:
      - serviceusers
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  # There is one OpenSearchACLConfig per service, shared by all its users; it is
  # never deleted. Removing a rotated-out user's ACL entry only mutates spec.acls,
  # which is "update" — "delete" would permit deleting the whole object, which
  # makes aiven-operator disable ACLs service-wide (unrestricted access for every
  # authenticated user). The CR is garbage-collected with its OpenSearch instance
  # via ownerReference. Service users themselves are deleted via the rule above.
  - apiGroups:
      - aiven.io
    resources:
      - opensearchaclconfigs
    verbs:
      - create
      - get
      - list
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aivenator.fullname" . }}
  labels:
    {{- include "aivenator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aivenator.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "aivenator.serviceAccountName" . }}
  namespace: "{{ .Release.Namespace }}"
